<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Similar Patent Finder</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1b2330; --muted: #5b6678; --border: #dfe3ea;
    --accent: #1f5fd1; --accent-text: #ffffff; --accent-soft: #e8f0fd;
    --ok: #1a7f4b; --ok-soft: #e5f5ec; --warn: #9a5b00; --warn-soft: #fff3dc;
    --bad: #b3261e; --bad-soft: #fdeceb; --quote: #f1f4f9; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161d; --surface: #1a2029; --text: #e6eaf0; --muted: #9aa5b8; --border: #2b3340;
      --accent: #6ea0ff; --accent-text: #0c1424; --accent-soft: #1d2a43;
      --ok: #5fd196; --ok-soft: #163226; --warn: #f0b45a; --warn-soft: #3a2c12;
      --bad: #ff8f87; --bad-soft: #3b1b19; --quote: #222a36;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 64px; }
  .topbar { display: flex; justify-content: flex-end; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: .85rem; font-weight: 600; padding: 4px 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  header { text-align: center; margin-top: 4px; }
  header h1 { margin: 0 0 6px; font-size: 1.9rem; }
  header p { margin: 0 auto; color: var(--muted); max-width: 640px; }
  .notice {
    margin: 14px auto 0; padding: 9px 14px; border-radius: var(--radius); max-width: 640px;
    background: var(--warn-soft); color: var(--warn); font-size: .9rem; text-align: left;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; margin-top: 16px;
  }
  label.field { display: block; font-weight: 600; margin-bottom: 6px; }
  .labelrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .labelrow label { margin: 0; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow > button:first-child { flex: 1; }
  button.info {
    flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--accent); cursor: pointer; padding: 0;
    font: italic 700 .95rem Georgia, "Times New Roman", serif;
  }
  button.info[aria-expanded="true"] { background: var(--accent); color: var(--accent-text); }
  .cost {
    background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 10px;
    font-size: .82rem; font-weight: 600; line-height: 1.4;
  }
  .infopanel {
    background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin-top: 6px;
    font-size: .88rem; line-height: 1.45;
  }
  .infopanel p { margin: 0 0 6px; }
  .infopanel p:last-child { margin-bottom: 0; }
  select, input[type=password] {
    width: 100%; padding: 10px 12px; border-radius: 10px; font: inherit;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .dataset-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 12px; }
  .dataset-info div { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
  .dataset-info b { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .dataset-desc { margin: 12px 0 0; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
  }
  textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  .row.spread { justify-content: space-between; }
  .hint { color: var(--muted); font-size: .88rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: .88rem;
  }
  .chip:hover { background: var(--accent-soft); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  @media (max-width: 640px) { .actions { grid-template-columns: 1fr; } }
  .action { display: flex; flex-direction: column; gap: 6px; }
  .action small { color: var(--muted); font-size: .85rem; line-height: 1.4; }
  button.primary, button.secondary {
    border-radius: 10px; padding: 11px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); }
  button.secondary { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  #loginMsg { color: var(--bad); margin-top: 8px; }
  #status { margin-top: 14px; }
  .banner { padding: 12px 14px; border-radius: var(--radius); font-size: .95rem; }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.bad { background: var(--bad-soft); color: var(--bad); }
  .banner.info { background: var(--accent-soft); color: var(--text); }
  .spinner {
    display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: -3px;
    border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.9s linear infinite;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .results-head { margin-top: 34px; padding-top: 18px; border-top: 2px solid var(--border); }
  .results-head h2 { margin: 0; font-size: 1.35rem; }
  .results-head .sub { color: var(--muted); margin: 2px 0 0; }
  .legend { margin-top: 12px; padding: 10px 14px; border-radius: var(--radius); background: var(--surface);
    border: 1px solid var(--border); color: var(--muted); font-size: .86rem; }
  .legend b { color: var(--text); }
  .result { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 14px; }
  .result h3 { margin: 0; font-size: 1.08rem; display: flex; gap: 10px; align-items: flex-start; }
  .rank {
    flex: none; display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--accent-soft); font-weight: 700; font-size: .9rem;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 8px; color: var(--muted); font-size: .9rem; }
  .meta a { font-weight: 600; }
  .sim { display: inline-flex; align-items: center; gap: 8px; }
  .sim .bar { width: 120px; height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .sim .bar > span { display: block; height: 100%; background: var(--accent); }
  .sim b { color: var(--text); }
  blockquote {
    margin: 10px 0 0; padding: 10px 12px; background: var(--quote); border-left: 4px solid var(--accent);
    border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  blockquote.verified { border-left-color: var(--ok); }
  blockquote.rejected { border-left-color: var(--bad); }
  .label { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 12px; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
  .cols p { margin: 2px 0 0; }
  footer { margin-top: 36px; color: var(--muted); font-size: .85rem; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="seg" role="group" aria-label="Language / Langue">
      <button type="button" id="langEn" aria-pressed="true">EN</button>
      <button type="button" id="langFr" aria-pressed="false">FR</button>
    </div>
  </div>

  <header>
    <h1>Similar Patent Finder</h1>
    <p data-i18n="subtitle"></p>
    <div class="notice" role="note" data-i18n="notice"></div>
  </header>

  <section class="card" id="collection">
    <div class="labelrow">
      <label class="field" for="corpus" data-i18n="dataset"></label>
      <button type="button" class="info" aria-expanded="false" aria-controls="infoDataset" data-i18n-title="infoLabel">i</button>
    </div>
    <div class="infopanel" id="infoDataset" hidden></div>
    <select id="corpus"></select>
    <div class="dataset-info" id="datasetInfo"></div>
    <p class="dataset-desc" id="datasetDesc"></p>
    <p class="hint" id="datasetNote"></p>
  </section>

  <section class="card" id="login" hidden>
    <form id="loginForm" novalidate>
      <label class="field" for="code" data-i18n="accessCode"></label>
      <p class="hint" data-i18n="loginHint"></p>
      <div class="row">
        <input id="code" type="password" autocomplete="off" spellcheck="false" placeholder="spf-...">
        <button class="primary" id="loginBtn" type="submit" data-i18n="signIn"></button>
      </div>
      <div id="loginMsg" role="alert"></div>
    </form>
  </section>

  <div class="row spread" id="sessionBar" hidden>
    <span class="hint" id="quota"></span>
    <button class="link" id="logout" type="button" data-i18n="logout"></button>
  </div>

  <form class="card" id="form" novalidate hidden>
    <label class="field" for="query" data-i18n="describe"></label>
    <textarea id="query" aria-describedby="count"></textarea>
    <div class="row"><span class="hint" id="count"></span></div>
    <div class="row"><span class="hint" data-i18n="tryExample"></span>
      <span class="chips" id="examples"></span></div>

    <div class="actions">
      <div class="action">
        <div class="btnrow">
          <button class="primary" id="goSearch" type="button" disabled data-i18n="btnSearch"></button>
          <button type="button" class="info" aria-expanded="false" aria-controls="infoSearch" data-i18n-title="infoLabel">i</button>
        </div>
        <small data-i18n="subSearch"></small>
        <div class="cost" id="costSearch" role="note"></div>
        <div class="infopanel" id="infoSearch" hidden></div>
      </div>
      <div class="action">
        <div class="btnrow">
          <button class="secondary" id="goExplain" type="button" disabled data-i18n="btnExplain"></button>
          <button type="button" class="info" aria-expanded="false" aria-controls="infoExplain" data-i18n-title="infoLabel">i</button>
        </div>
        <small id="subExplain"></small>
        <div class="cost" id="costExplain" role="note" hidden></div>
        <div class="infopanel" id="infoExplain" hidden></div>
      </div>
    </div>
    <div class="row"><button class="link" id="clear" type="button" data-i18n="clear"></button></div>
  </form>

  <div id="status" role="status" aria-live="polite"></div>

  <section id="resultsSection" hidden>
    <div class="results-head">
      <h2 data-i18n="results"></h2>
      <p class="sub" id="resultsSub"></p>
    </div>
    <div class="legend" id="legend"></div>
    <div id="results"></div>
  </section>

  <footer data-i18n-html="footer"></footer>
</div>

    sessionEnded: "Votre session a pris fin. Merci de vous reconnecter.",
    accessCode: "Code d'accès",
    loginHint: "Cette démo est privée, car chaque recherche coûte un peu d'argent. Saisissez le code d'accès qui vous a été remis.",
    signIn: "Se connecter", logout: "Se déconnecter", badCode: "Ce code d'accès n'est pas valide.",
    quota: "{left} requêtes restantes sur {limit} cette heure",
    noCorpus: "Aucun corpus de brevets en français n'est encore chargé. Passez en anglais (EN) pour essayer l'outil.",
    footer: "Données issues de PatentsView. Non soutenu par PatentsView ni par l'USPTO, et sans lien avec eux. Chaque corpus est un petit échantillon : l'absence de résultat ne prouve pas qu'il n'existe rien."
  }
};

let lang = "en", corpora = [], models = {}, cfg = { auth_required: false, answers_enabled: true };

function t(key, vars) {
  let s = (T[lang] && T[lang][key]) ?? T.en[key] ?? key;
  if (typeof s !== "string") return s;
  for (const [k, v] of Object.entries(vars || {})) s = s.split("{" + k + "}").join(v);
  return s;
}

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.append(c);
  return node;
}

function setStatus(kind, content) {
  const box = $("status");
  box.replaceChildren();
  if (!kind) return;
  const banner = el("div", { class: "banner " + kind });
  if (typeof content === "string") banner.textContent = content; else banner.append(content);
  box.append(banner);
}

const current = () => corpora.find((c) => c.id === $("corpus").value) || null;
const pct = (x) => Math.max(0, Math.min(100, Math.round(x * 100)));

function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach((n) => { n.title = t(n.dataset.i18nTitle); n.setAttribute("aria-label", t(n.dataset.i18nTitle)); });
  document.querySelectorAll("[data-i18n-html]").forEach((n) => { n.textContent = t(n.dataset.i18nHtml); });
  $("langEn").setAttribute("aria-pressed", String(lang === "en"));
  $("langFr").setAttribute("aria-pressed", String(lang === "fr"));
}

function storeGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }

/* ---------- collections ---------- */

async function loadCorpora() {
  let data = { corpora: [], models: {} };
  try { data = await (await fetch("/corpora?lang=" + lang)).json(); } catch (_) {}
  corpora = data.corpora; models = data.models || {};
  const select = $("corpus");
  select.replaceChildren();
  for (const c of corpora) {
    const n = c.patents === null || c.patents === undefined ? "" : " (" + t("sizeValue", { n: c.patents }) + ")";
    select.append(el("option", { value: c.id, text: c.label + n }));
  }
  const saved = storeGet("corpus_" + lang);
  if (saved && corpora.some((c) => c.id === saved)) select.value = saved;
  renderCollection();
}

function renderCollection() {
  const c = current();
  const info = $("datasetInfo");
  info.replaceChildren();
  $("query").disabled = !c;
  if (!c) {
    $("datasetDesc").textContent = t("noCorpus");
    $("datasetNote").textContent = "";
    $("query").placeholder = "";
    $("examples").replaceChildren();
    $("goSearch").disabled = true; $("goExplain").disabled = true;
    return;
  }
  const cell = (label, value) => el("div", {}, el("b", { text: label }), el("span", { text: value }));
  info.append(
    cell(t("size"), t("sizeValue", { n: c.patents === null ? "?" : c.patents })),
    cell(t("period"), t("periodValue", { from: c.period[0], to: c.period[1] })),
    cell(t("classification"), c.cpc),
    cell(t("language"), t("languageValue")[c.lang || lang] || ""),
  );
  $("datasetDesc").textContent = c.description;
  const modelLine = models.answer
    ? t("models", { embedding: models.embedding, answer: models.answer })
    : t("modelsSearchOnly", { embedding: models.embedding });
  $("datasetNote").textContent = (c.evaluated ? t("evaluated") : t("illustration")) + " " + modelLine;
  $("query").placeholder = c.placeholder;
  const ex = $("examples");
  ex.replaceChildren();
  c.examples.forEach(([label, text]) => {
    const chip = el("button", { class: "chip", type: "button", text: label });
    chip.addEventListener("click", () => { $("query").value = text; update(); $("query").focus(); });
    ex.append(chip);
  });
  $("subExplain").textContent = models.answer ? t("subExplain", { model: models.answer }) : t("subExplainOff");
  renderInfo(c);
  update();
}

function renderInfo(c) {
  const para = (text) => el("p", { text });
  $("infoSearch").replaceChildren(
    para(t("infoSearch1", { embedding: models.embedding || "" })), para(t("infoSearch2")));
  $("infoExplain").replaceChildren(...(models.answer
    ? [para(t("infoExplain1", { answer: models.answer })), para(t("infoExplain2"))]
    : [para(t("infoExplainOff"))]));
  const link = (href, text) => el("a", { href, target: "_blank", rel: "noopener noreferrer", text });
  $("infoDataset").replaceChildren(
    para(t("infoReal")),
    para(t("infoSource")),
    para(t("infoSample", { n: c.patents === null ? "?" : c.patents, cpc: c.cpc, from: c.period[0], to: c.period[1] })),
    para(t("infoLicense")),
    el("p", {},
      link("https://patentsview.org", t("linkPatentsView")), document.createTextNode(" · "),
      link("https://data.uspto.gov", t("linkUspto")), document.createTextNode(" · "),
      link("https://github.com/guillaumeoudin/similar-patent-finder/blob/master/DATA_LICENSES.md",
        t("linkLicenses"))));
}

document.querySelectorAll("button.info").forEach((b) => {
  b.addEventListener("click", () => {
    const panel = $(b.getAttribute("aria-controls"));
    const open = panel.hidden;
    panel.hidden = !open;
    b.setAttribute("aria-expanded", String(open));
  });
});

/* ---------- results ---------- */

function formatNumber(id) {
  return /^\d+$/.test(id) ? Number(id).toLocaleString("en-US") : id;
}

function patentLink(id) {
  return el("a", { href: "https://patents.google.com/patent/US" + encodeURIComponent(id),
                   target: "_blank", rel: "noopener noreferrer", text: "US " + formatNumber(id) });
}

function simBlock(similarity) {
  if (similarity === null || similarity === undefined) return null;
  const p = pct(similarity);
  const bar = el("span", { class: "bar" }, el("span"));
  bar.firstChild.style.width = p + "%";
  return el("span", { class: "sim", title: t("similarity") }, el("span", { text: t("similarity") }), bar, el("b", { text: p + "%" }));
}

function metaLine(h) {
  const meta = el("div", { class: "meta" }, patentLink(h.patent_id));
  if (h.year) meta.append(el("span", { text: t("granted", { year: h.year }) }));
  const s = simBlock(h.similarity);
  if (s) meta.append(s);
  return meta;
}

function sectionName(p) {
  return p.section === "abstract" ? t("abstract") : t("claim", { n: p.position });
}

function passage(p) {
  const wrap = el("div");
  const label = el("div", { class: "label", text: sectionName(p) + (p.similarity != null ? " · " + pct(p.similarity) + "%" : "") });
  wrap.append(label);
  const q = el("blockquote", { class: "clamp", text: p.text });
  wrap.append(q);
  if (p.text.length > 320) {
    const btn = el("button", { class: "link", type: "button", text: t("showMore") });
    btn.addEventListener("click", () => {
      const open = q.classList.toggle("clamp") === false;
      btn.textContent = open ? t("showLess") : t("showMore");
    });
    wrap.append(btn);
  }
  return wrap;
}

function showResultsHeader(sub) {
  const c = current();
  $("resultsSection").hidden = false;
  $("resultsSub").textContent = sub;
  const min = c && c.abstain_below ? Math.round(c.abstain_below * 100) : 0;
  $("legend").innerHTML = t("legend", { model: models.embedding || "", min });
}

function noMatch(data) {
  const c = current();
  $("results").replaceChildren();
  showResultsHeader("");
  $("resultsSub").textContent = "";
  setStatus("info", t("noMatch", {
    best: pct(data.best_similarity || 0),
    min: c && c.abstain_below ? Math.round(c.abstain_below * 100) : 0,
    description: c ? c.description : "",
  }));
}

function renderSearch(data) {
  const out = $("results");
  out.replaceChildren();
  if (data.abstained || data.hits.length === 0) { noMatch(data); return; }
  setStatus("", "");
  showResultsHeader(t("resultsSearch", { n: data.hits.length, corpus: current().label }));
  data.hits.forEach((h, i) => {
    const card = el("article", { class: "result" });
    card.append(el("h3", {}, el("span", { class: "rank", text: String(i + 1) }), el("span", { text: h.title || "Untitled" })));
    card.append(metaLine(h));
    h.passages.forEach((p) => card.append(passage(p)));
    out.append(card);
  });
}

function renderAnswer(data) {
  const out = $("results");
  out.replaceChildren();
  if (data.abstained) { noMatch(data); return; }
  showResultsHeader(t("resultsExplain", { corpus: current().label }));
  if (!data.reliable) setStatus("warn", t("unreliable"));
  else if (data.items.length === 0) setStatus("info", t("noneClose"));
  else setStatus("ok", t("allVerified"));
  const draw = (item, i) => {
    const card = el("article", { class: "result" });
    const badge = el("span", { class: "badge " + (item.verified ? "ok" : "bad"),
                               text: item.verified ? t("verified") : t("notVerified") });
    card.append(el("h3", {}, el("span", { class: "rank", text: String(i + 1) }), el("span", { text: item.title || "Untitled" })));
    const meta = metaLine(item);
    meta.append(badge);
    card.append(meta);
    card.append(el("blockquote", { class: item.verified ? "verified" : "rejected", text: item.excerpt }));
    card.append(el("div", { class: "cols" },
      el("div", {}, el("div", { class: "label", text: t("close") }), el("p", { text: item.close })),
      el("div", {}, el("div", { class: "label", text: t("different") }), el("p", { text: item.different }))));
    out.append(card);
  };
  data.items.forEach((it, i) => draw(it, i));
  data.rejected.forEach((it, i) => draw(it, data.items.length + i));
}

/* ---------- actions ---------- */

async function submit(mode) {
  const query = $("query").value.trim();
  const c = current();
  if (!c) return;
  $("goSearch").disabled = true; $("goExplain").disabled = true;
  $("results").replaceChildren();
  $("resultsSection").hidden = true;
  setStatus("info", el("span", {}, el("span", { class: "spinner" }),
    mode === "answer" ? t("comparing") : t("searching")));
  try {
    const resp = await fetch("/" + mode, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, corpus: c.id, lang }) });
    showQuota(resp.headers);
    if (!resp.ok) {
      let detail = "";
      try { detail = (await resp.json()).detail || ""; } catch (_) {}
      if (resp.status === 401) { showLogin(t("sessionEnded")); return; }
      if (resp.status === 429) throw new Error(detail || t("errLimit"));
      throw new Error(resp.status === 503 ? t("errNotReady", { detail }) : t("errGeneric", { status: resp.status, detail }));
    }
    const data = await resp.json();
    mode === "answer" ? renderAnswer(data) : renderSearch(data);
    if (!$("resultsSection").hidden) $("resultsSection").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    setStatus("bad", err instanceof TypeError ? t("errNetwork") : err.message);
  } finally {
    update();
  }
}

function update() {
  const n = $("query").value.trim().length;
  $("count").textContent = n < MIN_CHARS ? t("charsNeeded", { n, min: MIN_CHARS }) : t("chars", { n });
  const ready = n >= MIN_CHARS && current() !== null;
  $("goSearch").disabled = !ready;
  $("goExplain").disabled = !ready || !models.answer;
  const tokens = n === 0 ? t("costRange") : String(Math.max(1, Math.round(n / 4)));
  $("costSearch").textContent = t("costSearch", { n: tokens, embedding: models.embedding || "" });
  $("costExplain").hidden = !models.answer;
  $("costExplain").textContent = models.answer
    ? t("costExplain", { n: tokens, answer: models.answer }) : "";
}

/* ---------- sign in (hosted version only) ---------- */

function showQuota(headers) {
  const left = headers.get("X-Requests-Left"), limit = headers.get("X-Requests-Limit");
  if (left !== null) $("quota").textContent = t("quota", { left, limit });
}
function showLogin(message) {
  $("form").hidden = true; $("sessionBar").hidden = true; $("login").hidden = false;
  $("collection").hidden = true; $("resultsSection").hidden = true; $("results").replaceChildren();
  setStatus(message ? "warn" : "", message || "");
  $("code").value = ""; $("code").focus();
}
function showApp(me) {
  $("login").hidden = true; $("form").hidden = false; $("collection").hidden = false;
  if (me.limit !== null && me.limit !== undefined) {
    $("sessionBar").hidden = false;
    $("quota").textContent = t("quota", { left: me.left, limit: me.limit });
  }
  update();
}

async function start() {
  try { cfg = await (await fetch("/config")).json(); } catch (_) {}
  const wanted = new URLSearchParams(location.search).get("lang") || storeGet("lang");
  lang = wanted === "fr" ? "fr" : "en";
  applyStatic();
  await loadCorpora();
  const me = await (await fetch("/me")).json();
  me.signed_in ? showApp(me) : showLogin("");
}

async function setLang(next) {
  if (next === lang) return;
  lang = next; storeSet("lang", next);
  applyStatic();
  $("results").replaceChildren(); $("resultsSection").hidden = true; setStatus("", "");
  await loadCorpora();
}

$("langEn").addEventListener("click", () => setLang("en"));
$("langFr").addEventListener("click", () => setLang("fr"));
$("corpus").addEventListener("change", () => {
  storeSet("corpus_" + lang, $("corpus").value);
  $("results").replaceChildren(); $("resultsSection").hidden = true; setStatus("", "");
  renderCollection();
});
$("query").addEventListener("input", update);
$("goSearch").addEventListener("click", () => submit("search"));
$("goExplain").addEventListener("click", () => submit("answer"));
$("clear").addEventListener("click", () => {
  $("query").value = ""; $("results").replaceChildren(); $("resultsSection").hidden = true;
  setStatus("", ""); update(); $("query").focus();
});
$("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("loginBtn").disabled = true; $("loginMsg").textContent = "";
  try {
    const resp = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: $("code").value.trim() }) });
    if (!resp.ok) { $("loginMsg").textContent = t("badCode"); return; }
    setStatus("", "");
    showApp(await (await fetch("/me")).json());
  } catch (_) {
    $("loginMsg").textContent = t("errNetwork");
  } finally { $("loginBtn").disabled = false; }
});
$("logout").addEventListener("click", async () => {
  await fetch("/logout", { method: "POST" });
  showLogin("");
});

applyStatic();
start();
</script>
</body>
</html>
