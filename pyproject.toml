[project]
name = "priorart"
version = "0.1.0"
description = "Finds patents close to an invention description and quotes the exact passage, with every quote checked against the patent text"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "psycopg[binary]>=3.2", "pgvector>=0.3"]

[project.scripts]
priorart = "priorart.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
local = ["sentence-transformers==3.3.1", "transformers==4.46.3", "numpy<2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
priorart = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
