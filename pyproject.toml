[project]
name = "priorart"
version = "0.1.0"
description = "Prior art search assistant with a measured RAG pipeline (demo project)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "psycopg[binary]>=3.2", "pgvector>=0.3", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
local = ["sentence-transformers>=3"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
priorart = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
